name: Web

# Also called by image.yml, so an image is only pushed after these pass.
on:
  pull_request:
    paths:
      - 'web/**'
      - .github/workflows/web.yml
  workflow_call:

# Named literally: in a called workflow, github.workflow is the caller's name, and sharing its
# group would make the two cancel each other.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
