name: CI

# Docs-only changes don't need tests or a new image.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - LICENSE
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - LICENSE

# A newer push makes a running build of the same branch or PR pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...

  # Separate from the image's needs: a newly published advisory should show up red without stopping
  # an unrelated fix from shipping. Only vulnerabilities the code actually reaches fail it.
  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    needs: [web, go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/ffneumarkt/intern:latest
            ghcr.io/ffneumarkt/intern:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
