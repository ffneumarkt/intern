name: Image

# Docs-only changes don't need a new image. workflow_dispatch builds and publishes main like a push:
# automerge.yml starts it, since a merge made with the built-in token starts no push workflow.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - LICENSE
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - LICENSE

# A newer push makes a running build of the same branch or PR pointless.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests get these from web.yml and go.yml, and run them only when their code changed.
  web:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/web.yml

  go:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/go.yml

  image:
    needs: [web, go]
    # Plain needs would skip this on pull requests, where web and go are skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/ffneumarkt/intern:latest
            ghcr.io/ffneumarkt/intern:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
