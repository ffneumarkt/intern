# Dependabot opens pull requests against main; the usual CI (web, go, e2e, image, security) runs on them
# because each one touches the paths those workflows watch. Minor and patch updates of an ecosystem come
# as one PR a week; a major update gets its own PR so a breaking change is reviewed alone.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    groups:
      actions:
        update-types: [minor, patch]

  # The base images in the Dockerfile (node, golang, distroless).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
