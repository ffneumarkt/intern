# Dependabot opens pull requests against main; the usual CI (web, go, e2e, image, security) runs on them
# because each one touches the paths those workflows watch. Minor and patch updates of an ecosystem come
# as one PR a week; a major update gets its own PR so a breaking change is reviewed alone.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # @ionic/react-router (9.0.13, latest) accepts react-router and react-router-dom only below 7, and
    # fails with them at 7 (useLocation outside a <Router>); react-router-dom has no 8. Lift this once a
    # new @ionic/react-router release supports react-router 7 or later.
    ignore:
      - dependency-name: react-router
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
    groups:
      actions:
        update-types: [minor, patch]

  # The base images in the Dockerfile (node, golang, distroless).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Vienna
