# Reference for the VPS (/srv/intern). Secrets live in .env next to this file:
#   TUNNEL_TOKEN, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT, LOG_LEVEL
# Optional: ADMIN_API_ALLOW=true opens the dashboard and the admin API to requests through the tunnel (see deploy/README.md)
services:
  intern:
    image: ghcr.io/ffneumarkt/intern:latest
    restart: unless-stopped
    volumes:
      - ./data:/pb_data
    env_file: .env

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - intern
